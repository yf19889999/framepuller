name: Build APK
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle & Android SDK
        run: |
          # 1. 下载并安装 Gradle (绕过 wrapper)
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip -d /opt
          echo "PATH=/opt/gradle-7.5/bin:$PATH" >> $GITHUB_ENV
          
          # 2. 确认预装 SDK 路径 (ubuntu-latest 默认是 /usr/local/lib/android/sdk)
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # 3. 安装必要的 SDK 组件 (适配 compileSdk 33)
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: framepuller-debug
          path: app/build/outputs/apk/debug/app-debug.apk
