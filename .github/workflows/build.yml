name: Build APK
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle & Android SDK
        run: |
          # 1. 下载并安装 Gradle 7.5 (绕过 wrapper)
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip -d /opt
          echo "PATH=/opt/gradle-7.5/bin:$PATH" >> $GITHUB_ENV

          # 2. 配置 Android SDK 路径 (ubuntu-latest 预装)
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # 3. 动态寻找 sdkmanager 并安装组件 (适配 compileSdk 33)
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -n 1)
          echo "使用 sdkmanager: $SDKMANAGER"
          
          # 自动同意协议 + 安装必要组件
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: framepuller-debug
          path: app/build/outputs/apk/debug/app-debug.apk
